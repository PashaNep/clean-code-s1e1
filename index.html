<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" charset="utf-8" />
</head>
<body>
  <header class="intro">
    <img src="./eisenhower-matrix.jpg" alt="The eisenhower-matrix" />
    <a class="more_inf" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details</a>
  </header>

  <main class="centered-main-page-element">
    <section class="add-task">
      <form id="topSectionForAddingElementToList">
        <label for="new-task">Add Item</label>
        <div class="task-row-wrapper">
          <input id="new-task" class="task" type="text">
          <button>Add</button>
        </div>
      </form>
    </section>

    <section class="tasks">
      <article class="todo">
        <h3>Todo</h3>
        <ul id="incompleteTasks">
          <li>
            <input type="checkbox">
            <label class="task">Pay Bills</label>
            <input type="text" class="task">
            <button class="edit">Edit</button>
            <button class="delete">
              <img src="./remove.svg" alt="Remove button" />
            </button>
          </li>
          <li class="editMode">
            <input type="checkbox">
            <label class="task">Go Shopping</label>
            <input type="text" value="Go Shopping" class="task">
            <button class="edit">Save</button>
            <button class="delete">
              <img src="./remove.svg" alt="Remove button" />
            </button>
          </li>
        </ul>
      </article>

      <article class="completed">
        <h3>Completed</h3>
        <ul id="completed-tasks">
          <li>
            <input type="checkbox" checked>
            <label class="task">See the Doctor</label>
            <input type="text" class="task">
            <button class="edit">Edit</button>
            <button class="delete">
              <img src="./remove.svg" alt="Remove button" />
            </button>
          </li>
        </ul>
      </article>
    </section>
  </main>
  
  <script src="app.js"></script>
</body>
</html>
